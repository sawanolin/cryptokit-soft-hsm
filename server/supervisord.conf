[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/sdfx/supervisor.sock
chmod=0700
chown=sdfx:sdfx

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/sdfx/supervisor.sock

[program:sdfxd]
command=/usr/local/bin/sdfxd --config /etc/sdfx/sdfx.conf
user=sdfx
priority=10
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=LD_LIBRARY_PATH="/opt/openhitls/lib",SDFX_DATA_DIR="/var/lib/sdfx",SDFX_ADMIN_TOKEN_FILE="/run/sdfx/admin.token"

[program:web]
command=/opt/sdfx-web/bin/uvicorn app.main:app --app-dir /opt/sdfx-web-app --host 0.0.0.0 --port 18080 --workers 1
user=sdfx
priority=20
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",SDFX_DATA_DIR="/var/lib/sdfx",SDFX_DAEMON_HOST="127.0.0.1",SDFX_DAEMON_LISTEN_HOST="0.0.0.0",SDFX_DAEMON_PORT="18081",SDFX_ADMIN_TOKEN_FILE="/run/sdfx/admin.token",SDFX_SUPERVISOR_SOCKET="/run/sdfx/supervisor.sock"
