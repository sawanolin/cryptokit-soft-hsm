# Unix Socket mode configuration example
# Suitable for local high-performance communication

[transport]
type = unix
unix_path = /var/run/sdfxd.sock    # System-level socket path
unix_permissions = 0666            # Allow access for all users

[daemon]
log_level = warn        # Local communication, lower log level for better performance
max_clients = 50        # Fewer local clients expected
worker_threads = 4      # Local communication requires fewer threads
session_timeout = 300

[client]
connect_timeout = 3000   # Local connections should be fast
request_timeout = 10000  # Shorter timeout for local requests
retry_count = 3          # Fewer retries in local environment
retry_delay = 500        # Shorter retry interval

[security]
enable_tls = false      # TLS usually not needed for local communication