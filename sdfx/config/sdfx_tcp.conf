# TCP mode configuration example
# Suitable for network distributed deployment

[transport]
type = tcp
tcp_host = 0.0.0.0      # Listen on all network interfaces, allow remote connections
tcp_port = 18081         # Software cryptographic server port

[daemon]
log_level = info
max_clients = 200       # Support more concurrent clients
worker_threads = 16     # Network mode typically requires more threads
session_timeout = 600   # Network environment can have longer timeout

[client]
connect_timeout = 10000  # Network connections may be slower
request_timeout = 60000  # Network requests can have longer timeout
retry_count = 5          # Network instability, more retries
retry_delay = 2000       # Longer retry interval

[security]
enable_tls = false      # Optionally enable TLS encryption